<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>واجهات ثلاثية الأبعاد — ربط الموقع (تطوير)</title>
<style>
:root{--bg:#f4f1ea;--ink:#1f2a26;--line:#d8d2c4;--g:#1f3b33}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1e1c;--ink:#e8e6e0;--line:#3a3f3b}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,"DejaVu Sans",sans-serif}main{max-width:1500px;margin:auto;padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}select,button{font:inherit;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}article{border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(255,255,255,.5)}
canvas{width:100%;height:420px;display:block;border-radius:8px;background:#d9e3e9}h2{font-size:17px;margin:0 0 6px}.n{font-size:13px;opacity:.8}
table{border-collapse:collapse;font-size:13px}th,td{border:1px solid var(--line);padding:4px 8px;text-align:right}
</style></head><body><main>
<h1 style="font-size:22px">واجهات المبنى ثلاثية الأبعاد (فرع التطوير)</h1>
<p class="n">مربوطة بمستند التصميم نفسه: جهة المدخل وحدّ البروز مشتقان منه. الخامات تجريبية — لا تمثل منتجًا محددًا. لا اعتماد بصري ولا إنشائي.</p>
<div class="bar"><label>الجهة <select id="side"><option value="">الأمامية (المدخل)</option><option value="s">جنوب</option><option value="n">شمال</option><option value="e">شرق</option><option value="w">غرب</option></select></label><span id="src" class="n"></span><span id="st" class="n"></span></div>
<div class="grid" id="g"></div>
<details open><summary>القواعد المشتقة من المستند وحالة التحقق</summary><div id="rules"></div></details>
<script type="module">
import { loadThreeRuntime } from './three-runtime.mjs';
import { parseDoc } from './draw/doc.mjs';
import { loadSession, currentDoc } from './design-session.mjs';
import { connectSiteFacade, projectionBudgets, frontSideOf } from './facade-kit-site.mjs';
import { createFacadeViewer, exportFacadeGLB, downloadBlob } from './facade-kit/src/index.mjs';
const $ = s => document.querySelector(s), q = new URLSearchParams(location.search);
let doc, src;
try { const s = loadSession(localStorage); doc = s?.designs?.length ? currentDoc(s) : null; src = doc ? 'جلسة التصميم الحالية في المتصفح' : null; } catch {}
if (!doc || q.get('fixture')) { doc = parseDoc(await (await fetch('./facade-realism/C1.json')).text()); src = 'مستند C1 الاختباري (لا جلسة تصميم في هذا المتصفح)'; }
$('#src').textContent = 'المصدر: ' + src;
const actions = connectSiteFacade({ getDocument: () => doc });
const THREE = await loadThreeRuntime(); let viewers = [], results = {};
async function run() {
  viewers.forEach(v => v.dispose()); viewers = []; $('#g').replaceChildren(); $('#st').textContent = 'جاري التوليد…'; const side = $('#side').value || undefined, ev = [];
  const hash = await actions.documentHash();
  try {
    for (const style of ['A', 'B', 'C']) {
      const env = await actions.call('facade.generate', { expectedDocumentHash: hash, style }); const cur = await actions.call('facade.get', { resultId: env.resultId }); results[style] = cur;
      const art = document.createElement('article'), cv = document.createElement('canvas'), t = document.createElement('h2'), bar = document.createElement('div'); t.textContent = 'البديل ' + style; bar.className = 'bar';
      art.append(t, cv, bar); $('#g').append(art);
      const v = await createFacadeViewer(THREE, cv, cur.result, { side: side || cur.result.frontSide }); viewers.push(v);
      for (const [lab, fn] of [['PNG', async () => downloadBlob(await v.toBlob(), `facade-${style}.png`)], ['GLB', async () => downloadBlob(await exportFacadeGLB(v.model), `facade-${style}.glb`)]]) { const b = document.createElement('button'); b.textContent = lab; b.onclick = fn; bar.append(b); }
      const val = await actions.call('facade.validate', { resultId: env.resultId }); ev.push([style, cur.result.stats?.stoneTiles ?? v.stats.stoneTiles, Math.round(v.stats.triangles), val.integrity, val.fresh, val.issues.map(i => i.code || i).join(', ') || '—']);
    }
    const b = projectionBudgets(doc);
    $('#rules').innerHTML = `<p class="n">جهة المدخل: ${frontSideOf(doc)} · البروزات الجديدة متوقفة في الجهات الأربع (الصفر ليس حدًا نظاميًا). مرجع هندسي معلوماتي غير مستعمل (م): جنوب ${b.s}، شمال ${b.n}، شرق ${b.e}، غرب ${b.w}.</p><table><tr><th>البديل</th><th>خلايا الحجر</th><th>المثلثات</th><th>سلامة</th><th>حديثة</th><th>ملاحظات</th></tr>${ev.map(r => '<tr>' + r.map(x => '<td>' + x + '</td>').join('') + '</tr>').join('')}</table>`;
    $('#st').textContent = 'اكتمل.'; window.__KS = { ready: true, ev };
  } catch (e) { $('#st').textContent = 'تعذّر: ' + e.message; window.__KS = { ready: true, error: String(e.message) }; }
}
$('#side').onchange = run; await run();
</script></main></body></html>
