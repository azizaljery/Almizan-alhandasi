<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحميل خامات محلية للواجهة (تطوير)</title>
<style>body{font:15px system-ui,"DejaVu Sans",sans-serif;margin:0;background:#f4f1ea;color:#1f2a26}main{max-width:1100px;margin:auto;padding:16px}fieldset{border:1px solid #d8d2c4;border-radius:10px;margin:10px 0;padding:10px}label{display:block;margin:6px 0}input,select,button{font:inherit;padding:5px 8px;border:1px solid #cfc8b6;border-radius:8px}input[type=text],input[type=url]{width:100%;box-sizing:border-box}canvas{width:100%;height:420px;border-radius:10px;background:#d9e3e9;display:block}pre{background:#fff;padding:8px;border-radius:8px;overflow:auto;direction:ltr;text-align:left;font-size:12px}.n{font-size:13px;opacity:.8}</style></head><body><main>
<h1 style="font-size:22px">تحميل خامة سطح محلية</h1>
<p class="n">الملفات تبقى في المتصفح ولا تُرفع. لا يُقبل ملف بلا مصدر وترخيص. تسجيل «تمت مراجعة الترخيص» يتطلب رابط المصدر ورابط الترخيص ومعرّفه. الخامة المختارة لا تعني اعتماد منتج.</p>
<fieldset><legend>الخامة</legend>
<label>تطبيقها على <select id="key"><option value="stone">الحجر الفاتح (A)</option><option value="beigeStone">الحجر البيج (قاعدة B)</option></select></label>
<label>الاسم <input id="name" type="text" placeholder="مثال: Tiles 142"></label>
<label>رابط صفحة المصدر <input id="src" type="url" placeholder="https://…"></label>
<label>معرّف الترخيص <input id="lid" type="text" placeholder="CC0-1.0"></label>
<label>رابط نص الترخيص <input id="lurl" type="url" placeholder="https://…"></label>
<label>حالة الحقوق <select id="rights"><option value="LICENSE_REVIEWED">تمت مراجعة الترخيص</option><option value="USER_ATTESTED">إقرار المستخدم</option><option value="AUTHOR_CREATED">من إنشائي</option></select></label>
<label>عرض البلاطة المتكررة (م) <input id="tw" type="number" step="0.01" value="1.5"> ارتفاعها (م) <input id="th" type="number" step="0.01" value="1.5"></label>
<label>خريطة اللون (مطلوبة) <input id="f-color" type="file" accept="image/png,image/jpeg,image/webp"></label>
<label>Normal (OpenGL) <input id="f-normal" type="file" accept="image/png,image/jpeg,image/webp"></label>
<label>Roughness <input id="f-roughness" type="file" accept="image/png,image/jpeg,image/webp"></label>
<button id="go">تحميل وعرض</button> <span id="st" class="n"></span></fieldset>
<canvas id="cv"></canvas><h2 style="font-size:17px">سجل المصدر والترخيص</h2><pre id="log">—</pre><button id="dl" disabled>تنزيل السجل JSON</button>
<script type="module">
import {loadThreeRuntime} from '../../three-runtime.mjs';import {createFacadePackage,createFacadeViewer,loadSurfaceMapsFromFiles,downloadBlob} from '../src/index.mjs';import {projectOptions} from '../src/project.mjs';import {BUILD_INFO} from '../config/build-info.mjs';
import {buildAllSides,sideTransform} from '../../facade-realism/model.mjs';
const $=s=>document.querySelector(s),read=async p=>(await fetch(new URL(p,import.meta.url))).json();let viewer,asset,logObj;
$('#go').onclick=async()=>{$('#st').textContent='جاري التحميل…';try{
  const THREE=await loadThreeRuntime();viewer?.dispose();asset?.dispose();
  const files={color:$('#f-color').files[0],normal:$('#f-normal').files[0],roughness:$('#f-roughness').files[0]};
  const fields={id:'local-'+Date.now(),name:$('#name').value.trim(),source:{url:$('#src').value.trim()},license:{id:$('#lid').value.trim(),url:$('#lurl').value.trim()},rightsStatus:$('#rights').value,tileWidthM:Number($('#tw').value),tileHeightM:Number($('#th').value)};
  asset=await loadSurfaceMapsFromFiles(THREE,fields,files,{maxAnisotropy:4});
  const [doc,policy]=await Promise.all([read('../examples/source-C1.json'),read('../config/project-policy.json')]);
  const {parseDoc}=await import('../../draw/doc.mjs');const d=parseDoc(JSON.stringify(doc)),source=buildAllSides(d,'A'),transforms=Object.fromEntries(['s','n','e','w'].map(s=>[s,sideTransform(s,source[s].off)]));
  const packet=await createFacadePackage(source,{...projectOptions({policy,buildInfo:BUILD_INFO,projectId:'assets-lab',designId:'C1'}),transforms,style:'A'});
  viewer=await createFacadeViewer(THREE,$('#cv'),packet,{surfaceAssets:{[$('#key').value]:asset}});
  logObj={manifest:asset.manifest,evidence:asset.evidence,completeness:asset.completeness,visualApproval:'NOT_REVIEWED',productApproved:false};$('#log').textContent=JSON.stringify(logObj,null,1);$('#dl').disabled=false;$('#st').textContent='تم: '+asset.completeness;
}catch(e){$('#st').textContent='تعذّر: '+e.message;}};
$('#dl').onclick=()=>downloadBlob(new Blob([JSON.stringify(logObj,null,1)],{type:'application/json'}),'surface-asset-provenance.json');
</script></main></body></html>
