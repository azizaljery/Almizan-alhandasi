    wallTop: (() => { let y = 0; for (const m of S.meshes) { const r = m.userData?.role; if (r !== 'wall' && r !== 'cladding') continue; const b = new THREE.Box3().setFromObject(m); if (b.max.y > y) y = b.max.y; } return Math.round(y * 100) / 100; })() });
}

(async () => {
  try { if (mode === 'board') await boardMode(); else await variantMode(); }
  catch (e) { fail(e); }
})();
</script>
