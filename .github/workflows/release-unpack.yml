name: Unpack Mizan Release Candidate

on:
  push:
    branches:
      - integration/mizan-release
    paths:
      - 'release-upload/READY'

permissions:
  contents: write

jobs:
  unpack-verify-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: integration/mizan-release
          fetch-depth: 0

      - name: Reconstruct and verify release archive
        shell: bash
        run: |
          set -euo pipefail
          cat release-upload/part-* > /tmp/mizan-release.b64
          base64 -d /tmp/mizan-release.b64 > /tmp/mizan-release.zip
          echo "af53e5ff2a9e3e07755bfb52ee59c29acfd74169a60297925e8a650d908919c7  /tmp/mizan-release.zip" | sha256sum -c -
          rm -rf /tmp/mizan-unpack
          mkdir -p /tmp/mizan-unpack
          unzip -q /tmp/mizan-release.zip -d /tmp/mizan-unpack
          test -d /tmp/mizan-unpack/site-src

      - name: Replace branch content with verified source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/mizan-unpack/site-src/. .
          rm -rf release-upload
          rm -f .github/workflows/release-unpack.yml

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run build

      - name: Commit verified unpacked source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mizan-control-room"
          git config user.email "mizan-control-room@users.noreply.github.com"
          git add -A
          git commit -m "release: unpack and verify v33 P1 integrated source"
          git push origin HEAD:integration/mizan-release
