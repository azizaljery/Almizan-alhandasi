name: Release 005 Verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build validation
        run: node scripts/build.mjs
      - name: Targeted DEV-GATE-005 regressions
        run: node --test --test-name-pattern="unsupported floor|version endpoint|legacy multi-floor" tests/server.test.mjs tests/frontend.test.mjs
      - name: Full suite
        run: npm test
