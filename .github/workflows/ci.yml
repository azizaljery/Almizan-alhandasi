name: Mizan Engineering CI

on:
  push:
    branches:
      - extract-project-files
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --ignore-scripts
      - name: Test
        run: npm test
      - name: Build validation
        run: npm run build
