name: Photo Live Check (manual)

# فحص يدوي حي لميزة «صورة معمارية احترافية» على الموقع المنشور. يستدعي النموذج الحقيقي فعلًا،
# فكل تشغيل يستهلك رصيد Workers AI (صورة واحدة لكل مستوى). لا يعمل تلقائيًا أبدًا.
on:
  # الدفع إلى الفرع photo-live-check يشغّل الفحص أيضًا (بديل عن الزر اليدوي حين لا يكون الملف على الفرع الافتراضي)
  push:
    branches: [photo-live-check]
  workflow_dispatch:
    inputs:
      site_url:
        description: رابط الموقع المنشور
        default: https://almizan-handasi.aljeryabod.workers.dev
      tier:
        description: المستوى
        type: choice
        options: [standard, premium, both]
        default: standard
      lighting:
        description: الإضاءة
        type: choice
        options: [golden, day, sunset, night]
        default: golden
      variants:
        description: "اختياري: عدة صور للمقارنة tier:lighting[:seed] مفصولة بفواصل (يغلب المستوى والإضاءة)، حتى 8"
        default: ""

permissions:
  contents: write # لنشر النواتج إلى الفرع الجانبي photo-live-out عند التشغيل بالدفع

jobs:
  photo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate one professional photo on the live site
        run: node scripts/photo-live-check.mjs
        env:
          SITE_URL: ${{ inputs.site_url || 'https://almizan-handasi.aljeryabod.workers.dev' }}
          TIER: ${{ inputs.tier || 'both' }}
          LIGHTING: ${{ inputs.lighting || 'golden' }}
          VARIANTS: ${{ inputs.variants }} # فارغ عند الدفع: يؤخذ من .github/photo-live-check.conf إن وُجد (سطر VARIANTS=…)
          OUT: photo-live-out
      - name: Upload the generated photo and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-live-check
          path: photo-live-out
          if-no-files-found: warn
      # عند التشغيل بالدفع تُنشر النواتج إلى فرع جانبي للصور فقط
      - name: Publish outputs to the photo-live-out branch (side branch, images only)
        if: always() && github.event_name == 'push'
        run: |
          cd photo-live-out
          git init -q -b photo-live-out
          git config user.name "photo-live-check"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "photo live check outputs ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" photo-live-out
