name: Mizan Integration Verification

on:
  push:
    branches: [integration/verified-runtime-20260925]
  pull_request:
    branches: [extract-project-files]

permissions:
  contents: read

concurrency:
  group: mizan-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration source
        uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - name: Checkout immutable reference archives
        uses: actions/checkout@v4
        with:
          ref: 636d059d2f806864f090dbe24d95f6fbf4fd79db
          path: reference
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve source and verify archive identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mizan-evidence/reference-archives" "$RUNNER_TEMP/mizan-baseline"
          git -C project rev-parse HEAD > "$RUNNER_TEMP/mizan-evidence/commit.txt"
          git -C project archive --format=tar.gz HEAD > "$RUNNER_TEMP/mizan-evidence/source.tar.gz"
          node --version > "$RUNNER_TEMP/mizan-evidence/node-version.txt"
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import os, hashlib, zipfile, shutil, stat, json
          expected = {
            'claude-planner-v2.2.11.zip': '7afde4e05b3d7f7d123772041b3fe3005411ac316753fc25985f494b5bd6178b',
            'mizan-aziz-engine-candidate4R3-final.zip': 'b764fce4283fae21ebc4446308873b589e5c938916f6d82f4117688398807168',
          }
          records = []
          for name, digest in expected.items():
            p = Path('reference/artifacts') / name
            actual = hashlib.sha256(p.read_bytes()).hexdigest()
            assert actual == digest, f'Archive identity mismatch: {name}'
            shutil.copyfile(p, Path(os.environ['RUNNER_TEMP']) / 'mizan-evidence/reference-archives' / name)
            target = Path(os.environ['RUNNER_TEMP']) / 'mizan-baseline'
            with zipfile.ZipFile(p) as z:
              for i in z.infolist():
                rel = PurePosixPath(i.filename)
                assert not rel.is_absolute() and '..' not in rel.parts and '\\' not in i.filename
                assert not stat.S_ISLNK(i.external_attr >> 16)
              z.extractall(target)
            records.append({'file': name, 'sha256': actual})
          (Path(os.environ['RUNNER_TEMP']) / 'mizan-evidence/identities.json').write_text(json.dumps(records, indent=2))
          PY
      - name: Execute baseline tests and retain every exit code
        shell: bash
        run: |
          set +e
          E="$RUNNER_TEMP/mizan-evidence"
          (cd project && node --test --test-reporter=tap tests/*.test.mjs) > "$E/site-tests.log" 2>&1
          printf '%s\n' "$?" > "$E/site-tests.exit"
          (cd project && node scripts/build.mjs) > "$E/site-build.log" 2>&1
          printf '%s\n' "$?" > "$E/site-build.exit"
          (cd "$RUNNER_TEMP/mizan-baseline/claude-planner-v2" && node --test --test-reporter=tap tests/*.test.mjs) > "$E/claude-tests.log" 2>&1
          printf '%s\n' "$?" > "$E/claude-tests.exit"
          (cd "$RUNNER_TEMP/mizan-baseline/claude-planner-v2" && node tools/mutants.mjs) > "$E/claude-mutants.log" 2>&1
          printf '%s\n' "$?" > "$E/claude-mutants.exit"
          printf 'Official AZIZ Vitest and dependency review pending; no substitute runner is counted as Vitest.\n' > "$E/aziz-status.txt"
          for f in "$E"/*.exit; do printf '%s: ' "$(basename "$f")"; cat "$f"; done
      - name: Probe public site and Worker without credentials or paid requests
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, hashlib, os, re
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit
          root = Path(os.environ['RUNNER_TEMP']) / 'mizan-evidence'
          saved = root / 'live-assets'
          saved.mkdir()
          origin = 'https://al-mizan-al-handasi.aljeryabod.chatgpt.site/'
          queue = [(origin, 'index.html'), (origin + 'app.mjs', 'app.mjs'), ('https://al-mizan-api.ajeryabod.workers.dev/api/assistant/status', 'worker-status.json')]
          records, seen = [], set()
          while queue and len(seen) < 100:
            url, path = queue.pop(0)
            if url in seen: continue
            seen.add(url)
            try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mizan-owner-authorized-verification/1.0'})
              with urllib.request.urlopen(req, timeout=15) as r:
                body = r.read(2_000_001)
                info = {'url': url, 'status': r.status, 'finalUrl': r.url, 'contentType': r.headers.get('content-type', ''), 'bytes': len(body)}
                if len(body) <= 2_000_000:
                  info['sha256'] = hashlib.sha256(body).hexdigest()
                  if r.url.startswith(origin) or path == 'worker-status.json':
                    target = saved / path
                    target.parent.mkdir(parents=True, exist_ok=True)
                    target.write_bytes(body)
                    if path.endswith(('.mjs', '.js', '.html')):
                      text = body.decode('utf-8', errors='replace')
                      matches = re.findall(r"(?:from\s*|import\s*|new URL\(\s*)['\"](\./[^'\"]+)['\"]", text)
                      if path.endswith('.html'): matches += re.findall(r'(?:src|href)=[\"\'](\./[^\"\']+)[\"\']', text)
                      for rel in matches:
                        child = urljoin(url, rel)
                        if child.startswith(origin) and not urlsplit(child).query:
                          queue.append((child, urlsplit(child).path.lstrip('/')))
                records.append(info)
            except urllib.error.HTTPError as e:
              records.append({'url': url, 'status': e.code, 'error': str(e.reason)})
            except Exception as e:
              records.append({'url': url, 'error': str(e)})
          (root / 'live-http.json').write_text(json.dumps(records, ensure_ascii=False, indent=2))
          print(json.dumps(records, ensure_ascii=False, indent=2))
          PY
      - name: Retain source and evidence even when a test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mizan-integration-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/mizan-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce baseline test gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for step in site-tests site-build claude-tests claude-mutants; do
            test -f "$RUNNER_TEMP/mizan-evidence/$step.exit"
            test "$(cat "$RUNNER_TEMP/mizan-evidence/$step.exit")" = 0
          done
