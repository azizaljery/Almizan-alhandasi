name = "almizan-handasi"
main = "worker/server.mjs"
compatibility_date = "2026-09-19"
workers_dev = true

[observability]
enabled = true

# Secrets are configured remotely, never committed here:
# ANTHROPIC_API_KEY
# ANTHROPIC_MODEL (optional, default claude-sonnet-5-5)
# MIZAN_ACCESS_CODE
# Optional: ALLOWED_ORIGIN

# The manual production deployment workflow injects BUILD_SHA from its checked-out commit.
# For local deployments, pass --var BUILD_SHA:$(git rev-parse HEAD).
